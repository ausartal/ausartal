<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <!-- card -->
  <rect x="10" y="10" width="900" height="210" rx="18" fill="#1A222B"/>
  <rect x="10.5" y="10.5" width="899" height="209" rx="17.5" fill="none" stroke="#2F3A45"/>

  <!-- illustrator mark: nib / pen star hybrid -->
  <circle cx="78" cy="115" r="36" stroke="#E8A598" stroke-width="1.8" fill="#E8A598" fill-opacity="0.14"/>
  <path d="M78 88 L 84 108 L 105 109 L 89 122 L 94 142 L 78 129 L 62 142 L 67 122 L 51 109 L 72 108 Z" fill="#E8A598" opacity="0.92"/>
  <!-- nib stroke under star -->
  <path d="M64 150 C 72 146, 84 154, 92 148" stroke="#E8D5A3" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- overline -->
  <text x="140" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9AA5B1" letter-spacing="3.2">ILLUSTRATOR  ·  GAME  ·  DESIGN  ·  CODE</text>

  <!-- name -->
  <text x="138" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#F2EDE6" letter-spacing="-0.8">Ausartal</text>

  <!-- subtitle -->
  <text x="140" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#9AA5B1">Creating is drawing, erasing, and drawing again —</text>
  <text x="140" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#9AA5B1">illustration, game craft, and software, practiced for years.</text>

  <!-- badge line -->
  <text x="140" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E8A598" letter-spacing="1.15">GAME DEV  ·  DESIGN  ·  CODE  ·  SOUND</text>

  <!-- pastel accent bars -->
  <rect x="780" y="72" width="88" height="7" rx="3.5" fill="#E8A598"/>
  <rect x="780" y="90" width="72" height="7" rx="3.5" fill="#E8D5A3"/>
  <rect x="780" y="108" width="82" height="7" rx="3.5" fill="#A8C5A8"/>
  <rect x="780" y="126" width="58" height="7" rx="3.5" fill="#B8A9C9"/>
  <rect x="780" y="144" width="68" height="7" rx="3.5" fill="#A8C0D4"/>

  <!-- soft corner ticks -->
  <path d="M28 36 L 28 22 L 42 22" stroke="#E8D5A3" stroke-width="1.2" opacity="0.4" fill="none"/>
  <path d="M892 194 L 892 208 L 878 208" stroke="#A8C5A8" stroke-width="1.2" opacity="0.4" fill="none"/>
</svg>