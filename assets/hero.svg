<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#141C38"/>
      <stop offset="100%" stop-color="#1E2450"/>
    </linearGradient>
    <radialGradient id="nebA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6B4FA0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6B4FA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#C45C7A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C45C7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="32%" cy="28%">
      <stop offset="0%" stop-color="#C8B8F5"/>
      <stop offset="45%" stop-color="#7B6BD0"/>
      <stop offset="100%" stop-color="#2A2460"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8EC5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B8A0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8EC5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAF4FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1100" height="380" fill="url(#sky)"/>
  <ellipse cx="930" cy="120" rx="230" ry="150" fill="url(#nebA)"/>
  <ellipse cx="190" cy="320" rx="200" ry="120" fill="url(#nebB)"/>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="36" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="72" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="28" r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="58" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="22" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="48" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="18" r="1.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="52" r="1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="46" r="1.1"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="90" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="210" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="310" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="340" r="1.3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="300" r="1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.4s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="330" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.85s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="290" r="1"><animate attributeName="opacity" values="1;0.35;1" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="250" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" begin="0.45s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="260" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.7s" begin="1.15s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="120" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="0.65s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="100" r="1.1"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="150" r="0.9"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="180" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="0.95s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="330" r="1"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="0.55s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="350" r="1.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="80" r="1"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- manga sparkles -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none">
    <g><path d="M200 55 L 200 67 M 194 61 L 206 61"/><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/></g>
    <g><path d="M620 45 L 620 59 M 613 52 L 627 52"/><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></g>
    <g><path d="M1040 185 L 1040 196 M 1034.5 190.5 L 1045.5 190.5"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></g>
    <g><path d="M120 230 L 120 240 M 115 235 L 125 235"/><animate attributeName="opacity" values="1;0.25;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></g>
    <g><path d="M820 320 L 820 330 M 815 325 L 825 325"/><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></g>
    <g><path d="M480 195 L 480 204 M 475.5 199.5 L 484.5 199.5"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></g>
  </g>

  <!-- shooting stars -->
  <g>
    <circle r="2.5" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 70 -22" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <animateMotion path="M -20 55 L 260 18" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="2" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 55 -16" stroke="url(#trail)" stroke-width="1.6" stroke-linecap="round"/>
    <animateMotion path="M 820 70 L 1040 28" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="1.8" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 48 -14" stroke="url(#trail)" stroke-width="1.4" stroke-linecap="round"/>
    <animateMotion path="M 150 250 L 340 200" dur="6s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="6s" begin="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- floating planet -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="7s" repeatCount="indefinite"/>
    <circle cx="940" cy="155" r="74" fill="url(#glowC)" opacity="0.65"/>
    <circle cx="940" cy="155" r="56" fill="url(#planetBody)"/>
    <ellipse cx="922" cy="136" rx="13" ry="7" fill="#A898E8" opacity="0.45"/>
    <ellipse cx="958" cy="165" rx="17" ry="8" fill="#5A4AA0" opacity="0.35"/>
    <ellipse cx="932" cy="175" rx="9" ry="5" fill="#B8A8F0" opacity="0.3"/>
    <ellipse cx="940" cy="155" rx="82" ry="18" fill="none" stroke="url(#ring)" stroke-width="3.2" transform="rotate(-18 940 155)"/>
    <ellipse cx="940" cy="155" rx="82" ry="18" fill="none" stroke="#B8A0FF" stroke-width="1" opacity="0.3" transform="rotate(-18 940 155)"/>
  </g>

  <!-- small cyan moon -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="700" cy="72" r="13" fill="#5AC8FF" opacity="0.9"/>
    <circle cx="696" cy="68" r="6.5" fill="#8EC5FF" opacity="0.55"/>
    <circle cx="700" cy="72" r="21" fill="#5AC8FF" opacity="0.12"/>
    <ellipse cx="700" cy="72" rx="25" ry="8" fill="none" stroke="#8EC5FF" stroke-width="1.2" opacity="0.45" transform="rotate(-25 700 72)"/>
  </g>

  <!-- comet -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6.5s" repeatCount="indefinite"/>
    <circle cx="160" cy="100" r="6" fill="#F0A0A0"/>
    <circle cx="160" cy="100" r="11" fill="#F0A0A0" opacity="0.18"/>
    <path d="M160 100 L 240 73" stroke="#F0A0A0" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
    <path d="M160 100 L 225 63" stroke="#E8C878" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M160 100 L 218 90" stroke="#8EC5FF" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.12">
    <path d="M680 320 L 1060 285"><animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/></path>
    <path d="M700 348 L 1080 312"><animate attributeName="opacity" values="0.15;0.06;0.15" dur="5s" begin="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- TEXT SCRIM -->
  <rect x="48" y="52" width="620" height="276" rx="16" fill="#0B1020" opacity="0.5"/>

  <!-- content: left margin 72 -->
  <rect x="72" y="80" width="42" height="2" fill="#E8C878" opacity="0.9"/>
  <text x="72" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9AA3B8" letter-spacing="3">ILLUSTRATION  ·  GAME  ·  DESIGN  ·  CODE</text>

  <text x="70" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#F4F0E8" letter-spacing="-1">Ausartal</text>

  <path d="M72 196 C 156 206, 236 194, 316 200" stroke="#F0A0A0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>

  <text x="72" y="238" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#9AA3B8">Creating is drawing, erasing, and drawing again.</text>

  <!-- chips: left margin 72 = bottom margin 72 (380-72-32=276) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
    <rect x="72" y="276" width="120" height="32" rx="16" fill="#F0A0A0"/>
    <text x="132" y="297" text-anchor="middle" fill="#1A1520">GAME · 6 YRS</text>

    <rect x="208" y="276" width="120" height="32" rx="16" fill="#E8C878"/>
    <text x="268" y="297" text-anchor="middle" fill="#1A1520">DESIGN · 4 YRS</text>

    <rect x="344" y="276" width="120" height="32" rx="16" fill="#8FD0B0"/>
    <text x="404" y="297" text-anchor="middle" fill="#1A1520">CODE · 5 YRS</text>

    <rect x="480" y="276" width="136" height="32" rx="16" fill="#B8A8E0"/>
    <text x="548" y="297" text-anchor="middle" fill="#1A1520">BEATMAKER · 1 YR</text>
  </g>
</svg>
