<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#141C38"/>
      <stop offset="100%" stop-color="#1E2450"/>
    </linearGradient>
    <radialGradient id="nebA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6B4FA0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6B4FA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#C45C7A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C45C7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="32%" cy="28%">
      <stop offset="0%" stop-color="#C8B8F5"/>
      <stop offset="45%" stop-color="#7B6BD0"/>
      <stop offset="100%" stop-color="#2A2460"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8EC5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B8A0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8EC5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAF4FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="920" height="340" fill="url(#sky)"/>
  <ellipse cx="790" cy="100" rx="210" ry="140" fill="url(#nebA)"/>
  <ellipse cx="170" cy="280" rx="190" ry="110" fill="url(#nebB)"/>

  <!-- twinkling stars (spread across full canvas) -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="36" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="72" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="28" r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="58" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="22" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="48" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="18" r="1.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="52" r="1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="46" r="1.1"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="90" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="140" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="190" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="280" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="305" r="1.3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="275" r="1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.4s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="300" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.85s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="260" r="1"><animate attributeName="opacity" values="1;0.35;1" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="230" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" begin="0.45s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="240" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.7s" begin="1.15s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="110" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="0.65s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="100" r="1.1"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.5s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="140" r="0.9"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="170" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="0.95s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="300" r="1"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="0.55s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="310" r="1.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="80" r="1"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- manga sparkles -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none">
    <g><path d="M175 50 L 175 62 M 169 56 L 181 56"/><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/></g>
    <g><path d="M565 40 L 565 54 M 558 47 L 572 47"/><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></g>
    <g><path d="M880 170 L 880 181 M 874.5 175.5 L 885.5 175.5"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></g>
    <g><path d="M110 210 L 110 220 M 105 215 L 115 215"/><animate attributeName="opacity" values="1;0.25;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></g>
    <g><path d="M730 290 L 730 300 M 725 295 L 735 295"/><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></g>
    <g><path d="M430 175 L 430 184 M 425.5 179.5 L 434.5 179.5"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></g>
  </g>

  <!-- shooting stars -->
  <g>
    <circle r="2.5" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 70 -22" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <animateMotion path="M -20 50 L 230 16" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="4.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="2" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 55 -16" stroke="url(#trail)" stroke-width="1.6" stroke-linecap="round"/>
    <animateMotion path="M 700 60 L 890 20" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="5.2s" begin="1.8s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="1.8" fill="#EAF4FF" cx="0" cy="0"/>
    <path d="M0 0 L 48 -14" stroke="url(#trail)" stroke-width="1.4" stroke-linecap="round"/>
    <animateMotion path="M 140 230 L 310 185" dur="6s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="6s" begin="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- floating planet (right, out of text zone) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="7s" repeatCount="indefinite"/>
    <circle cx="810" cy="140" r="68" fill="url(#glowC)" opacity="0.65"/>
    <circle cx="810" cy="140" r="52" fill="url(#planetBody)"/>
    <ellipse cx="794" cy="122" rx="13" ry="7" fill="#A898E8" opacity="0.45"/>
    <ellipse cx="826" cy="150" rx="17" ry="8" fill="#5A4AA0" opacity="0.35"/>
    <ellipse cx="804" cy="158" rx="9" ry="5" fill="#B8A8F0" opacity="0.3"/>
    <ellipse cx="810" cy="140" rx="76" ry="17" fill="none" stroke="url(#ring)" stroke-width="3.2" transform="rotate(-18 810 140)"/>
    <ellipse cx="810" cy="140" rx="76" ry="17" fill="none" stroke="#B8A0FF" stroke-width="1" opacity="0.3" transform="rotate(-18 810 140)"/>
  </g>

  <!-- small cyan moon (upper mid-left empty) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="620" cy="70" r="13" fill="#5AC8FF" opacity="0.9"/>
    <circle cx="616" cy="66" r="6.5" fill="#8EC5FF" opacity="0.55"/>
    <circle cx="620" cy="70" r="21" fill="#5AC8FF" opacity="0.12"/>
    <ellipse cx="620" cy="70" rx="25" ry="8" fill="none" stroke="#8EC5FF" stroke-width="1.2" opacity="0.45" transform="rotate(-25 620 70)"/>
  </g>

  <!-- comet -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6.5s" repeatCount="indefinite"/>
    <circle cx="150" cy="95" r="6" fill="#F0A0A0"/>
    <circle cx="150" cy="95" r="11" fill="#F0A0A0" opacity="0.18"/>
    <path d="M150 95 L 230 68" stroke="#F0A0A0" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
    <path d="M150 95 L 215 58" stroke="#E8C878" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M150 95 L 208 85" stroke="#8EC5FF" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- faint speed lines -->
  <g stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.12">
    <path d="M560 285 L 900 250"><animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/></path>
    <path d="M580 310 L 910 275"><animate attributeName="opacity" values="0.15;0.06;0.15" dur="5s" begin="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- TEXT SCRIM — roomy padding -->
  <rect x="40" y="40" width="560" height="250" rx="16" fill="#0B1020" opacity="0.5"/>

  <!-- content with generous spacing -->
  <rect x="64" y="68" width="42" height="2" fill="#E8C878" opacity="0.9"/>
  <text x="64" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9AA3B8" letter-spacing="3">ILLUSTRATION  ·  GAME  ·  DESIGN  ·  CODE</text>

  <text x="62" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#F4F0E8" letter-spacing="-1">Ausartal</text>

  <path d="M64 180 C 148 190, 228 178, 308 184" stroke="#F0A0A0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>

  <text x="64" y="220" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#9AA3B8">Creating is drawing, erasing, and drawing again.</text>

  <!-- chips: solid, equal, with breathing room -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
    <rect x="64" y="248" width="118" height="30" rx="15" fill="#F0A0A0"/>
    <text x="123" y="268" text-anchor="middle" fill="#1A1520">GAME · 6 YRS</text>

    <rect x="198" y="248" width="118" height="30" rx="15" fill="#E8C878"/>
    <text x="257" y="268" text-anchor="middle" fill="#1A1520">DESIGN · 4 YRS</text>

    <rect x="332" y="248" width="118" height="30" rx="15" fill="#8FD0B0"/>
    <text x="391" y="268" text-anchor="middle" fill="#1A1520">CODE · 5 YRS</text>

    <rect x="466" y="248" width="132" height="30" rx="15" fill="#B8A8E0"/>
    <text x="532" y="268" text-anchor="middle" fill="#1A1520">BEATMAKER · 1 YR</text>
  </g>
</svg>
