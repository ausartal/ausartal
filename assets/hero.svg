<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <rect width="920" height="260" rx="12" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="919" height="259" rx="11.5" fill="none" stroke="#30363D"/>

  <!-- thin top rule -->
  <rect x="48" y="40" width="64" height="1" fill="#B08968"/>

  <text x="48" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" letter-spacing="3.5">PORTFOLIO</text>

  <text x="46" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#E6EDF3" letter-spacing="-1.2">Ausartal</text>

  <text x="48" y="172" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#8B949E">Creating is drawing, erasing, and drawing again.</text>

  <!-- monochrome discipline labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E6EDF3">
    <rect x="48" y="198" width="128" height="30" rx="2" fill="none" stroke="#30363D"/>
    <text x="112" y="218" text-anchor="middle" letter-spacing="1.2">GAME DEV · 6 YRS</text>

    <rect x="188" y="198" width="120" height="30" rx="2" fill="none" stroke="#30363D"/>
    <text x="248" y="218" text-anchor="middle" letter-spacing="1.2">DESIGN · 4 YRS</text>

    <rect x="320" y="198" width="112" height="30" rx="2" fill="none" stroke="#30363D"/>
    <text x="376" y="218" text-anchor="middle" letter-spacing="1.2">CODE · 5 YRS</text>

    <rect x="444" y="198" width="116" height="30" rx="2" fill="none" stroke="#30363D"/>
    <text x="502" y="218" text-anchor="middle" letter-spacing="1.2">SOUND · 1 YR</text>
  </g>

  <!-- restrained geometric mark, right -->
  <g fill="none" stroke="#30363D" stroke-width="1">
    <line x1="780" y1="80" x2="860" y2="80"/>
    <line x1="800" y1="100" x2="860" y2="100"/>
    <rect x="780" y="130" width="48" height="48" stroke="#B08968" stroke-opacity="0.5"/>
    <line x1="780" y1="130" x2="828" y2="178" stroke="#B08968" stroke-opacity="0.35"/>
  </g>
</svg>