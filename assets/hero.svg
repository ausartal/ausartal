<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <rect width="920" height="260" fill="#161B22"/>

  <!-- subtle side washes ONLY on right empty zone -->
  <ellipse cx="820" cy="130" rx="120" ry="110" fill="#D4A094" opacity="0.12"/>
  <ellipse cx="760" cy="200" rx="100" ry="60" fill="#9BB39B" opacity="0.1"/>
  <ellipse cx="860" cy="50" rx="80" ry="50" fill="#D9C89A" opacity="0.1"/>

  <!-- thin left rule -->
  <rect x="56" y="48" width="48" height="2" fill="#D4A094" opacity="0.85"/>

  <!-- overline -->
  <text x="56" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9A9590" letter-spacing="3.2">ILLUSTRATION  ·  GAME  ·  DESIGN  ·  CODE</text>

  <!-- name -->
  <text x="54" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#F0EBE3" letter-spacing="-1.2">Ausartal</text>

  <!-- single clean underline -->
  <rect x="56" y="154" width="220" height="1.5" fill="#D4A094" opacity="0.7"/>

  <!-- tagline -->
  <text x="56" y="188" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#9A9590">Creating is drawing, erasing, and drawing again.</text>

  <!-- chips in clear row, no decoration under them -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="56" y="212" width="118" height="28" rx="14" fill="#D4A094" fill-opacity="0.14" stroke="#D4A094" stroke-opacity="0.45"/>
    <text x="115" y="231" text-anchor="middle" fill="#D4A094">GAME · 6 YRS</text>

    <rect x="186" y="212" width="118" height="28" rx="14" fill="#D9C89A" fill-opacity="0.14" stroke="#D9C89A" stroke-opacity="0.45"/>
    <text x="245" y="231" text-anchor="middle" fill="#D9C89A">DESIGN · 4 YRS</text>

    <rect x="316" y="212" width="114" height="28" rx="14" fill="#9BB39B" fill-opacity="0.14" stroke="#9BB39B" stroke-opacity="0.45"/>
    <text x="373" y="231" text-anchor="middle" fill="#9BB39B">CODE · 5 YRS</text>

    <rect x="442" y="212" width="118" height="28" rx="14" fill="#B0A3C0" fill-opacity="0.14" stroke="#B0A3C0" stroke-opacity="0.45"/>
    <text x="501" y="231" text-anchor="middle" fill="#B0A3C0">SOUND · 1 YR</text>
  </g>

  <!-- quiet marks in right empty area only -->
  <path d="M700 80 C 740 60, 780 95, 820 72" stroke="#9BB39B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M720 120 C 760 105, 800 135, 850 115" stroke="#D4A094" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="700" cy="80" r="2.5" fill="#D4A094" opacity="0.55"/>
  <circle cx="820" cy="72" r="2.5" fill="#D9C89A" opacity="0.55"/>
  <path d="M780 175 L 812 207 L 780 239 L 748 207 Z" stroke="#9BB5C4" stroke-width="1.2" fill="#9BB5C4" fill-opacity="0.08" opacity="0.5"/>
</svg>