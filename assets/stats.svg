<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" fill="none">
  <!-- soft panel -->
  <rect x="1" y="1" width="518" height="148" rx="14" stroke="#2A2E35" stroke-width="1" fill="#12181F"/>

  <!-- decorative corner arcs -->
  <path d="M20 20 Q 32 20, 32 32" stroke="#E07A5F" stroke-width="1.2" opacity="0.5" fill="none"/>
  <path d="M500 130 Q 488 130, 488 118" stroke="#81B29A" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- title -->
  <text x="28" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8B949E" letter-spacing="1.5">A FEW NUMBERS</text>
  <line x1="28" y1="48" x2="120" y2="48" stroke="#E07A5F" stroke-width="1.2" opacity="0.6"/>

  <!-- stats as editorial figures -->
  <text x="28" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#F3EFE7">15</text>
  <text x="28" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6E7681" letter-spacing="1.6">PUBLIC WORKS</text>

  <text x="170" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#E07A5F">4</text>
  <text x="170" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6E7681" letter-spacing="1.6">MAIN TOOLS</text>

  <text x="300" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#81B29A">5+</text>
  <text x="300" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6E7681" letter-spacing="1.6">YEARS DRAWING</text>

  <!-- tiny doodle mark -->
  <path d="M430 70 C 450 55, 470 85, 490 68" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round" opacity="0.55" fill="none"/>
  <circle cx="492" cy="68" r="2.5" fill="#C9A227" opacity="0.7"/>
</svg>
