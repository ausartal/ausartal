    <rect x="358" y="86" width="102" height="24" rx="12" stroke="#C9A227" stroke-width="1" fill="#C9A227" fill-opacity="0.08"/>
    <text x="409" y="102" fill="#C9A227" text-anchor="middle">Clip Studio</text>
  </g>

  <!-- accent dots -->
  <circle cx="490" cy="32" r="2.5" fill="#81B29A" opacity="0.6"/>
  <circle cx="500" cy="32" r="2.5" fill="#E07A5F" opacity="0.5"/>
